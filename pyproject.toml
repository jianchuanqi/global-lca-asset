[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "global-lca-asset"
version = "0.2.0"
description = "Evidence-backed Global LCA Asset Knowledge Graph API and importer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Global LCA Asset Review" }]
dependencies = [
  "fastapi>=0.116,<1",
  "mcp>=2,<3",
  "neo4j>=5.28,<7",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
global-lca = "global_lca_asset.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/global_lca_asset"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
